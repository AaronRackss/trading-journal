<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trading Journal V1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    box-sizing:border-box;
    --bg:#050505; --surface: rgba(20, 20, 20, 0.7); --border: rgba(255, 255, 255, 0.1);
    --text:#FFFFFF; --text-dim:#A0A0A0;
    --accent: #3B82F6; --accent-soft: rgba(59, 130, 246, 0.15);
    --win:#10B981; --win-soft: rgba(16, 185, 129, 0.15);
    --loss:#EF4444; --loss-soft: rgba(239, 68, 68, 0.15);
    --be:#64748B; --be-soft: rgba(100, 116, 139, 0.15);
    --eval:#3B82F6; --eval-soft: rgba(59, 130, 246, 0.15);
    --buffer:#F59E0B; --buffer-soft: rgba(245, 158, 11, 0.15);
    --funded:#10B981; --funded-soft: rgba(16, 185, 129, 0.15);
    --failed:#EF4444; --failed-soft: rgba(239, 68, 68, 0.15);
    --passed:#A855F7; --passed-soft: rgba(168, 85, 247, 0.15);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#050505; --surface: rgba(20, 20, 20, 0.7); --border: rgba(255, 255, 255, 0.1);
      --text:#FFFFFF; --text-dim:#A0A0A0;
      --accent:#3B82F6; --accent-soft: rgba(59, 130, 246, 0.15);
      --win:#10B981; --win-soft: rgba(16, 185, 129, 0.15);
      --loss:#EF4444; --loss-soft: rgba(239, 68, 68, 0.15);
      --be:#64748B; --be-soft: rgba(100, 116, 139, 0.15);
    }
  }
  :root[data-theme="dark"]{
    --bg:#050505; --surface: rgba(20, 20, 20, 0.7); --border: rgba(255, 255, 255, 0.1);
    --text:#FFFFFF; --text-dim:#A0A0A0;
    --accent:#3B82F6; --accent-soft: rgba(59, 130, 246, 0.15);
    --win:#10B981; --win-soft: rgba(16, 185, 129, 0.15);
    --loss:#EF4444; --loss-soft: rgba(239, 68, 68, 0.15);
    --be:#64748B; --be-soft: rgba(100, 116, 139, 0.15);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100dvh; background:#000; color:var(--text);
    font-family: 'Inter', -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing:antialiased;
    display:block;
    overflow:hidden;
    width: 100vw;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .app{
    display:flex; flex-direction:column;
    height:100dvh; width:100vw;
    background:var(--bg);
    position:fixed;
    top: 0;
    left: 0;
    overflow:hidden;
    transition: all 0.3s ease;
    animation: appEntrance 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes appEntrance {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .fade-in-card {
    animation: cardEntrance 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (min-width: 400px) {
    .app {
      height: 100vh; width: 100vw;
      border: none; border-radius: 0;
      box-shadow: none;
    }
  }
  header{
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  header p{margin:2px 0 0; font-size:13px; color:var(--text-dim);}
  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 8px;}
  nav{
    display:flex; flex-shrink:0; border: 1px solid var(--border);
    background:var(--surface);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    z-index: 10;
    margin: 0 12px 24px;
    border-radius: 40px;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
  }
  nav button{
    flex:1; background:none; border:none; padding:10px 2px 10px; font-size:10px;
    color:var(--text); font-family:inherit; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; cursor:pointer;
  }
  nav button i{font-size:18px; width:18px; height:18px;}
  nav button.active{color:var(--accent);}
  .view{display:none;}
  .view.active{display:block;}
  .view-log-container {
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .view-log-container > * {
    width: 100%;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px;
    box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:active{
    transform: scale(0.98);
  }
  .card h3{margin:0 0 4px; font-size:16px; font-weight:700; letter-spacing:-0.02em;}
  .card .meta{font-size:12px; color:var(--text-dim); font-weight:500;}
  .rowstats{display:flex; gap:14px; margin-top:10px; font-size:14px;}
  .rowstats div{color:var(--text-dim);}
  .rowstats strong{display:block; color:var(--text); font-size:16px; font-weight:650;}
  .empty{
    text-align:center; color:var(--text-dim); font-size:14px; padding:40px 20px;
  }
  .btn{
    background: linear-gradient(135deg, var(--accent), #2563EB); color:#FFFFFF; border:none; border-radius:14px;
    padding:14px 16px; font-size:15px; font-weight:600; width:100%; cursor:pointer;
    font-family:inherit; transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
  }
  .btn:active{
    transform: scale(0.97);
    opacity: 0.9;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
  }
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none;}
  .btn.danger{background:transparent; color:var(--loss); border:1px solid var(--loss); box-shadow:none;}
  .fab{
    position:sticky; bottom:0; margin:6px 0 4px; z-index:2;
  }
  label{display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 5px; text-align:center;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], textarea, select{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 11px; font-size:15px; color:var(--text); font-family:inherit;
    text-align:center;
  }
  input::placeholder, textarea::placeholder, select::placeholder {
    color: transparent;
  }
  .rulerow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .rulerow input{flex:1;}
  .rulerow button{
    background:var(--loss-soft); color:var(--loss); border:none; border-radius:7px;
    width:34px; height:34px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .addrule{display:flex; gap:8px; margin-bottom:14px;}
  .addrule input{flex:1;}
  .addrule button{
    background:var(--accent-soft); color:var(--accent); border:none; border-radius:8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    padding:0 14px; font-weight:650; font-size:14px; cursor:pointer;
  }
  .checklist label.chk{
    display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:var(--text);
    padding:9px 0; border-bottom:1px solid var(--border); margin:0; cursor:pointer;
  }
  .checklist label.chk:last-child{border-bottom:none;}
  .checklist input[type=checkbox]{width:19px; height:19px; margin-top:1px; accent-color:var(--accent); flex-shrink:0;}
  .segmented{display:flex; gap:8px; margin-bottom:2px;}
  .segmented.sticky-tabs{
    position: relative; z-index: 10;
    background: var(--bg);
    padding: 8px 0;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    display: flex;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .segmented.sticky-tabs::-webkit-scrollbar {
    display: none;
  }
  .segmented button{
    flex: 0 0 auto; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    background:var(--surface); color:var(--text-dim); font-weight:650; font-size:13.5px;
    cursor:pointer; font-family:inherit;
  }
  .segmented button.sel[data-r="win"]{background:rgba(76, 193, 126, 0.2); color:var(--win); border-color:var(--win);}
  .segmented button.sel[data-r="loss"]{background:rgba(226, 100, 95, 0.2); color:var(--loss); border-color:var(--loss);}
  .segmented button.sel[data-r="be"]{background:rgba(35, 131, 226, 0.2); color:var(--accent); border-color:var(--accent);}
  .segmented button.sel[data-r="active"]{background:var(--be-soft); color:var(--be); border-color:var(--be);}
  .segmented button.sel[data-r="eval"]{background:var(--eval-soft); color:var(--eval); border-color:var(--eval);}
  .segmented button.sel[data-r="buffer"]{background:var(--buffer-soft); color:var(--buffer); border-color:var(--buffer);}
  .segmented button.sel[data-r="funded"]{background:var(--funded-soft); color:var(--funded); border-color:var(--funded);}
  .segmented button.sel[data-r="failed"]{background:var(--failed-soft); color:var(--failed); border-color:var(--failed);}
  .segmented button.sel[data-r="passed"]{background:var(--passed-soft); color:var(--passed); border-color:var(--passed);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .top-actions{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .iconbtn{
    background:var(--accent-soft); color:var(--accent); border:none; border-radius:8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    padding:8px 14px; font-weight:650; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .badge{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; text-transform: uppercase;
  }
  .badge.eval{background:transparent; color:var(--eval); border:1px solid var(--eval);}
  .badge.buffer{background:transparent; color:var(--buffer); border:1px solid var(--buffer);}
  .badge.funded{background:transparent; color:var(--funded); border:1px solid var(--funded);}
  .badge.failed{background:transparent; color:var(--failed); border:1px solid var(--failed);}
  .badge.passed{background:transparent; color:var(--passed); border:1px solid var(--passed);}
  .badge.win{background:var(--win-soft); color:var(--win);}
  .badge.loss{background:var(--loss-soft); color:var(--loss);}
.badge.tp{background:transparent; color:var(--funded); border:1px solid var(--funded);}   /* verde */
.badge.sl{background:transparent; color:var(--loss); border:1px solid var(--loss);}       /* rojo */
.badge.be{background:transparent; color:var(--be); border:1px solid var(--be);}         /* azul */
.badge.time{background:transparent; color:#555; border:1px solid #555;}                     /* gris */
.chart-container{
  width:100%;
  max-width:600px;
  margin:auto 0 20px;
}
  .account-info-fixed {
    text-align: center;
    margin: 12px auto;
    width: 100%;
    max-width: 400px;
  }
  .account-info-fixed .card {
    text-align: center;
    transition: all 0.3s ease;
  }
  .account-info-fixed .rowstats {
    justify-content: center;
  }
  .toast.show{opacity:1;}
  .privacy-btn{background:none; border:none; font-size:19px; cursor:pointer; padding:6px; margin-top:2px; color:var(--text); display:flex; align-items:center; justify-content:center;}
  .money{transition:filter .15s;}
  .money.pos{color:var(--win);}
  .money.neg{color:var(--loss);}
  body.privacy .money{filter:blur(6px); user-select:none;}
  .bar{background:var(--bg); border:1px solid var(--border); border-radius:6px; height:7px; overflow:hidden; margin-top:4px;}
  .bar > div{height:100%; background:var(--accent);}
  .bar.risk > div{background:var(--loss);}
  .cover{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; margin-bottom:10px; display:block; background:var(--bg); cursor:zoom-in;}
  .section-title{font-size:12px; font-weight:700; color:var(--text); text-transform:uppercase; letter-spacing:.03em; margin:22px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .heatmap-container{
    margin-bottom:24px;
    text-align:center;
  }
  .heatmap-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:4px;
    max-width:300px;
    margin:12px auto;
  }
  .heatmap-day{
    aspect-ratio:1;
    border-radius:4px;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    cursor:pointer;
    transition:transform 0.1s;
    background:var(--border);
    border: 2px solid transparent;
  }
  .heatmap-day:active{transform:scale(0.9);}
  .heatmap-day.win-1{background:rgba(16, 185, 129, 0.3);}
  .heatmap-day.win-2{background:rgba(16, 185, 129, 0.6);}
  .heatmap-day.win-3{background:var(--win);}
  .heatmap-day.loss-1{background:rgba(239, 68, 68, 0.3);}
  .heatmap-day.loss-2{background:rgba(239, 68, 68, 0.6);}
  .heatmap-day.loss-3{background:var(--loss);}

  .lightbox{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85); display:none; z-index:1000;
    justify-content:center; align-items:center; backdrop-filter:blur(5px);
  }
  .lightbox.show{display:flex;}
  #lightboxImg{
    max-width:90%; max-height:90%; object-fit:contain;
    transition:transform 0.1s ease-out; cursor:move;
  }

  .filter-date-group{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    justify-content:center;
  }
  .heatmap-controls-btn{
    background: #FFF !important;
    color: #000 !important;
    border: none !important;
    box-shadow: none !important;
  }

  .mistake-chip-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .mistake-chip {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    transition: all 0.2s ease;
    user-select: none;
  }
  .mistake-chip.selected {
    background: var(--loss-soft);
    color: var(--loss);
    border-color: var(--loss);
  }
  .mistake-analysis-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .mistake-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .mistake-row .info {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
  }
  .mistake-row .impact-bar-container {
    flex: 2;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    position: relative;
  }
  .mistake-row .impact-bar {
    height: 100%;
    background: var(--loss);
    transition: width 0.3s ease;
  }
  .mistake-row .cost {
    width: 80px;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--loss);
  }

</style>
</head>
<body>
<div class="app">
  <header style="display:flex; justify-content:center; align-items:center; position:relative;">
    <div style="display:flex; flex-direction:column; align-items:center">
      <p id="subtitle" style="text-align:center; margin:0; font-weight:700; font-size:18px; color:var(--text)">Futures Tracker</p>
    </div>
    <button id="privacyBtn" class="privacy-btn" onclick="togglePrivacy()" style="position:absolute; right:20px">
      <i data-lucide="eye-off"></i>
    </button>
  </header>

  <main>
    <section id="view-accounts" class="view"></section>
    <section id="view-log" class="view active"></section>
    <section id="view-certs" class="view"></section>
    <section id="view-history" class="view"></section>
  </main>

  <nav>
    <button data-view="accounts"><i data-lucide="wallet"></i>Cuentas</button>
    <button data-view="log" class="active"><i data-lucide="book-open"></i>Registro</button>
    <button data-view="history"><i data-lucide="history"></i>Historial</button>
    <button data-view="certs"><i data-lucide="coins"></i>Finanzas</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src=""></div>

<script>
const STORE_KEY = "mfb_playbook_v1";
const SUPABASE_URL = "https://ebyktlxyadyxlbpwwjxf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Fzxd2AvJ8V_aU8zf1bWGGg_3mt2skUK";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = { setups: [], trades: [], accounts: [], reviews: {}, certs: [], expenses: [], pendingPayouts: [] };
let editingAccountId = null;
let editingTradeId = null;
let accountsFilter = "Total";

let selectedTradeReviewId = null;
let selectedTradeHistoryId = null;
async function load(){
  try{
    const { data, error } = await _supabase
      .from('user_data')
      .select('data')
      .single();

    if (data && data.data) {
      state = data.data;
      console.log("Cargado desde Supabase");
    } else {
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) state = JSON.parse(raw);
      console.log("Cargado desde LocalStorage");
    }
  }catch(e){
    console.error("load error", e);
    state = {setups:[], trades:[], accounts:[], reviews:{}, certs:[], expenses:[]};
  }
  if(!state.accounts) state.accounts = [];
  if(!state.reviews) state.reviews = {};
  if(!state.certs) state.certs = [];
  if(!state.expenses) state.expenses = [];
  if(!state.pendingPayouts) state.pendingPayouts = [];
}
function togglePrivacy(){
  const isPrivacyActive = document.body.classList.contains("privacy");
  const nextState = !isPrivacyActive;
  document.body.classList.toggle("privacy", nextState);
  const btn = document.getElementById("privacyBtn");
  // Si la privacidad está ACTIVA (nextState=true), mostramos el ojo tachado (eye-off)
  // Si la privacidad está INACTIVA (nextState=false), mostramos el ojo abierto (eye)
  btn.innerHTML = nextState ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
  lucide.createIcons();
  try{ localStorage.setItem("mfb_privacy", nextState?"1":"0"); }catch(e){}
}
function initPrivacy(){
  let on=false;
  try{ on = localStorage.getItem("mfb_privacy")==="1"; }catch(e){}
  document.body.classList.toggle("privacy", on);
  const btn = document.getElementById("privacyBtn");
  btn.innerHTML = on ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
  lucide.createIcons();
}
async function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch(e){
    console.error("ls save error", e);
  }

  try {
    const { error } = await _supabase
      .from('user_data')
      .upsert({ id: 'main_user', data: state });

    if (error) throw error;
  } catch(e){
    console.error("supabase save error", e);
    toast("Error al sincronizar con la nube");
  }
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function openLightbox(src){
  const img = document.getElementById("lightboxImg");
  img.src = src;
  img.style.transform = "scale(1) translate(0px, 0px)";
  document.getElementById("lightbox").classList.add("show");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("show");
  document.getElementById("lightboxImg").src = "";

// --- Gestures for Zoom and Pan ---
let scale = 1, lastScale = 1, startX = 0, startY = 0, translateX = 0, translateY = 0;
let initialDist = 0;
const lbImg = document.getElementById("lightboxImg");

lbImg.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
  } else {
    startX = e.touches[0].pageX - translateX;
    startY = e.touches[0].pageY - translateY;
  }
}, {passive: false});

lbImg.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    scale = Math.max(1, lastScale * (dist / initialDist));
    lbImg.style.transform = `scale(${scale}) translate(${translateX/scale}px, ${translateY/scale}px)`;
  } else {
    if (scale > 1) {
      translateX = e.touches[0].pageX - startX;
      translateY = e.touches[0].pageY - startY;
      lbImg.style.transform = `scale(${scale}) translate(${translateX/scale}px, ${translateY/scale}px)`;
    }
  }
}, {passive: false});

lbImg.addEventListener("touchend", () => {
  lastScale = scale;
  if (scale <= 1) { translateX = 0; translateY = 0; }
});
document.addEventListener("click", e=>{
  if(e.target.classList && e.target.classList.contains("cover")){
    e.stopPropagation();
    openLightbox(e.target.src);
  }
});

function tradeOutcome(t){
  if(!t.hadTrade) return null;
  if(t.result==='TP') return 'win';
  if(t.result==='SL') return 'loss';
  if(t.result==='BE') return 'neutral';
  if(t.result==='TIME'){
    if(t.pnl>0) return 'win';
    if(t.pnl<0) return 'loss';
    return 'neutral';
  }
  return null;
}
function accountStats(accountId){
  const acc = state.accounts.find(a=>a.id===accountId);
  const trades = state.trades.filter(t=>t.accountId===accountId);
  const tradeEntries = trades.filter(t=>t.hadTrade);
  const count = tradeEntries.length;
  const pnlVals = trades.filter(t=>t.pnl!=null).map(t=>t.pnl);
  const totalPnl = pnlVals.reduce((a,b)=>a+b,0);
  const wins = tradeEntries.filter(t=>tradeOutcome(t)==='win');
  const losses = tradeEntries.filter(t=>tradeOutcome(t)==='loss');
  const decisive = wins.length + losses.length;
  const winrate = decisive ? Math.round((wins.length/decisive)*100) : 0;

  // --- Advanced Metrics ---
  const grossProfit = wins.reduce((sum, t) => sum + (t.pnl || 0), 0);
  const grossLoss = Math.abs(losses.reduce((sum, t) => sum + (t.pnl || 0), 0));
  const profitFactor = grossLoss !== 0 ? (grossProfit / grossLoss).toFixed(2) : (grossProfit > 0 ? '∞' : '0.00');

  const avgWin = wins.length ? (grossProfit / wins.length).toFixed(0) : 0;
  const avgLoss = losses.length ? (grossLoss / losses.length).toFixed(0) : 0;

  const balance = (acc && acc.size!=null)? (acc.size + totalPnl) : null;
  return {count, totalPnl, winrate, balance, profitFactor, avgWin, avgLoss};
}
function challengeStats(accountId){
  const acc = state.accounts.find(a=>a.id===accountId);
  const trades = state.trades.filter(t=>t.accountId===accountId && t.pnl!=null).sort((a,b)=>a.date-b.date);
  let running = acc.size||0, peak = acc.size||0;
  const dayTotals = {};
  trades.forEach(t=>{
    running += t.pnl;
    if(running>peak) peak = running;
    const dKey = new Date(t.date).toDateString();
    dayTotals[dKey] = (dayTotals[dKey]||0) + t.pnl;
  });
  const todayKey = new Date().toDateString();
  return {
    profitSoFar: running - (acc.size||0),
    drawdownUsed: peak - running,
    daysTraded: Object.keys(dayTotals).length,
    todayPnl: dayTotals[todayKey] || 0
  };
}
function bar(pct, risk){
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  return `<div class="bar${risk?' risk':''}"><div style="width:${p}%"></div></div>`;
}
function challengeBlockHtml(a){
  if(a.profitTarget==null && a.dailyLossLimit==null && a.maxDrawdown==null && a.minDays==null) return "";
  const cs = challengeStats(a.id);
  let rows = ``;

  if(a.profitTarget){
    const progress = Math.max(0, Math.min(100, (cs.profitSoFar/a.profitTarget)*100));
    const remaining = a.profitTarget - cs.profitSoFar;
    rows += `
      <div class="meta" style="margin-top:8px; display:flex; justify-content:space-between">
        <span>Objetivo</span>
        <span>${remaining > 0 ? 'Faltan $' + remaining.toFixed(0) : '¡Objetivo alcanzado!'}</span>
      </div>
      ${bar(progress, false)}
    `;
  }
  if(a.dailyLossLimit){
    const used = cs.todayPnl < 0 ? Math.abs(cs.todayPnl) : 0;
    const progress = Math.max(0, Math.min(100, (used/a.dailyLossLimit)*100));
    const remaining = a.dailyLossLimit - used;
    rows += `
      <div class="meta" style="margin-top:8px; display:flex; justify-content:space-between">
        <span>Pérdida Diaria</span>
        <span>Límite: $${remaining.toFixed(0)}</span>
      </div>
      ${bar(progress, true)}
    `;
  }
  if(a.maxDrawdown){
    const progress = Math.max(0, Math.min(100, (cs.drawdownUsed/a.maxDrawdown)*100));
    const remaining = a.maxDrawdown - cs.drawdownUsed;
    rows += `
      <div class="meta" style="margin-top:8px; display:flex; justify-content:space-between">
        <span>Drawdown Máx.</span>
        <span>Margen: $${remaining.toFixed(0)}</span>
      </div>
      ${bar(progress, true)}
    `;
  }
  if(a.minDays){
    rows += `<div class="meta" style="margin-top:8px; display:flex; justify-content:space-between">
      <span>Días Operados</span>
      <span>${cs.daysTraded} / ${a.minDays}</span>
    </div>`;
  }
  return rows;
}

function renderAccounts(showForm){
  const el = document.getElementById("view-accounts");
  if(showForm){ el.innerHTML = accountFormHtml(); return; }

  let tabsHtml = `
    <div class="segmented sticky-tabs">
      <button class="${accountsFilter==='Active'?'sel':''}" data-r="active" onclick="setAccountsFilter('Active')">Active</button>
      <button class="${accountsFilter==='Evals'?'sel':''}" data-r="eval" onclick="setAccountsFilter('Evals')">Evals</button>
      <button class="${accountsFilter==='Passed'?'sel':''}" data-r="passed" onclick="setAccountsFilter('Passed')">Passed</button>
      <button class="${accountsFilter==='Buffer'?'sel':''}" data-r="buffer" onclick="setAccountsFilter('Buffer')">Buffer</button>
      <button class="${accountsFilter==='Fundeds'?'sel':''}" data-r="funded" onclick="setAccountsFilter('Fundeds')">Fundeds</button>
      <button class="${accountsFilter==='Failed'?'sel':''}" data-r="failed" onclick="setAccountsFilter('Failed')">Failed</button>
    </div>`;

  if(state.accounts.length===0){
    el.innerHTML = tabsHtml + `
      <div class="empty">Aún no tienes cuentas.<br>Añade tu primera cuenta fondeada o en evaluación.</div>
      <button class="btn" onclick="openNewAccount()">+ Nueva cuenta</button>`;
    return;
  }

  let filteredAccounts = state.accounts;
  if(accountsFilter === 'Active') filteredAccounts = state.accounts.filter(a => {
    const stats = challengeStats(a.id);
    const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;
    return a.status !== 'Fallida' || isPassed;
  });
  else if(accountsFilter === 'Evals') filteredAccounts = state.accounts.filter(a => {
    const stats = challengeStats(a.id);
    const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;
    return a.status === 'En evaluación' && !isPassed;
  });
  else if(accountsFilter === 'Buffer') filteredAccounts = state.accounts.filter(a => {
    const stats = challengeStats(a.id);
    const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;
    return a.status === 'Buffer' && !isPassed;
  });
  else if(accountsFilter === 'Fundeds') filteredAccounts = state.accounts.filter(a => {
    const stats = challengeStats(a.id);
    const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;
    return a.status === 'Fondeada' || (a.status === 'Buffer' && isPassed);
  });
  else if(accountsFilter === 'Failed') filteredAccounts = state.accounts.filter(a => a.status === 'Fallida');
  else if(accountsFilter === 'Passed') filteredAccounts = state.accounts.filter(a => {
    const stats = challengeStats(a.id);
    return a.status === 'En evaluación' && a.profitTarget && stats.profitSoFar >= a.profitTarget;
  });

  let html = tabsHtml + `<div class="top-actions"><button class="iconbtn" onclick="openNewAccount()">+ Nueva cuenta</button></div>`;

  filteredAccounts.forEach((a, index)=>{
    const st = accountStats(a.id);
    const statusClass = a.status === 'En evaluación' ? 'eval' :
                        a.status === 'Buffer' ? 'buffer' :
                        a.status === 'Fondeada' ? 'funded' : 'failed';

    const stats = challengeStats(a.id);
    const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;

    let finalStatusClass = statusClass;
    let displayStatus = a.status;

    if (isPassed) {
      if (a.status === 'Buffer') {
        finalStatusClass = 'funded';
        displayStatus = 'Fondeada';
      } else if (a.status === 'En evaluación') {
        finalStatusClass = 'passed';
        displayStatus = 'Passed';
      }
    }

    html += `
      <div class="card fade-in-card" style="animation-delay: ${index * 0.1}s">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
          <h3 style="margin:0; display:flex; align-items:center; gap:8px">${escapeHtml(a.name)}<i data-lucide="edit-3" style="cursor:pointer; width:14px; height:14px; color:var(--text-dim)" onclick="event.stopPropagation(); openEditAccount('${a.id}')"></i></h3>
          <span class="badge ${finalStatusClass}">${escapeHtml(displayStatus)}</span>

        <div class="rowstats">
          <div>Balance<strong class="money">${st.balance!=null? '$'+st.balance.toFixed(0) : '—'}</strong></div>

          <div>Winrate<strong>${st.count? st.winrate+'%':'—'}</strong></div>

          <div>Avg Loss<strong class="money neg">$${st.avgLoss || '0'}</strong></div>

  const profitTarget = num("accTarget"), dailyLossLimit = num("accDaily"),
        maxDrawdown = num("accDD"), minDays = num("accMinDays");

                      a.status === 'Fondeada' ? 'var(--funded)' :
                      a.status === 'Fallida' ? 'var(--loss)' : 'var(--be)';

  // Check if it reached the goal but is still in eval/buffer
  const stats = challengeStats(a.id);
  const isPassed = a.profitTarget && stats.profitSoFar >= a.profitTarget;

  // Logic for the final color
  let finalColor = statusColor;
  let finalSoftColor = a.status === 'En evaluación' ? 'var(--eval-soft)' :
                      a.status === 'Buffer' ? 'var(--buffer-soft)' :
                      a.status === 'Fondeada' ? 'var(--funded-soft)' :
                      a.status === 'Fallida' ? 'var(--loss-soft)' : 'var(--be-soft)';

  if (isPassed) {
    if (a.status === 'Buffer') {
      finalColor = 'var(--funded)';
      finalSoftColor = 'var(--funded-soft)';
    } else if (a.status === 'En evaluación') {
      finalColor = 'var(--passed)';
      finalSoftColor = 'var(--passed-soft)';
    }
  }

  let displayStatus = a.status;
  if (isPassed) {
    if (a.status === 'Buffer') {
      displayStatus = 'Fondeada';
    } else if (a.status === 'En evaluación') {
      displayStatus = 'Passed';
    }
  }

  return `
    <div class="account-info-fixed">
      <div class="card" style="border-color:${finalColor}; background:${finalSoftColor}">
        <div class="meta" style="text-align:center">Fase</div><h3 style="text-align:center">${escapeHtml(displayStatus)}</h3>
        <div class="rowstats" style="justify-content:center">
          <div style="text-align:center">Balance<strong class="money">${st.balance!=null?'$'+st.balance.toFixed(0):'—'}</strong></div>
          <div style="text-align:center">Balance %<strong class="money ${balPct!=null && parseFloat(balPct)>=0 ? 'pos' : 'neg'}">${balPct!=null? balPct+'%':'—'}</strong></div>
          <div style="text-align:center">Objetivo<strong class="money">${a.profitTarget?'$'+a.profitTarget:'—'}</strong></div>
          <div style="text-align:center">Max. DD<strong class="money">${a.maxDrawdown?'$'+a.maxDrawdown:'—'}</strong></div>
        </div>
        <div class="meta" style="margin-top:10px; text-align:center">Cuentas activas ahora mismo: ${activeCount}</div>
      </div>
    </div>`;
}

function bindLogForm(){
  const input = document.getElementById("logPhotoInput");
  if(!input) return;
  input.addEventListener("change", async e=>{

    if(!file) return;
    try{
      captureLogDraft();
      logPhotoPreview = await compressImage(file, 900, 0.6);
      renderLog();

const PREDEFINED_MISTAKES = ["FOMO", "Overtrading", "No respetar SL", "Entrada apresurada", "Cierre prematuro", "Falta de confirmación", "Venganza", "Operar noticia"];

function renderMistakeChips() {
  const container = document.getElementById("mistakes-container");
  if(!container) return;

  const currentMistakes = Array.isArray(logDraft.logMistakes) ? logDraft.logMistakes : (logDraft.logMistakes ? logDraft.logMistakes.split(",") : []);

  const allMistakes = [...new Set([...PREDEFINED_MISTAKES, ...currentMistakes])];

  container.innerHTML = allMistakes.map(m => {
    const mistake = m.trim();
    if(!mistake) return "";
    const isSelected = currentMistakes.includes(mistake);
    return `<div class="mistake-chip ${isSelected?'selected':''}" onclick="toggleMistakeChip('${mistake}')">${escapeHtml(mistake)}</div>`;
  }).join("");
}

function toggleMistakeChip(m) {
  if(!Array.isArray(logDraft.logMistakes)) {
    logDraft.logMistakes = logDraft.logMistakes ? logDraft.logMistakes.split(",") : [];
  }

  const idx = logDraft.logMistakes.indexOf(m);
  if(idx > -1) {
    logDraft.logMistakes.splice(idx, 1);
  } else {
    logDraft.logMistakes.push(m);
  }
  renderMistakeChips();
}

function addCustomMistake() {
  const input = document.getElementById("customMistakeInput");
  const val = input.value.trim();
  if(!val) return;

  if(!Array.isArray(logDraft.logMistakes)) {
    logDraft.logMistakes = logDraft.logMistakes ? logDraft.logMistakes.split(",") : [];
  }

  if(!logDraft.logMistakes.includes(val)) {
    logDraft.logMistakes.push(val);
  }
  input.value = "";
  renderMistakeChips();
}

function saveTrade(){
  captureLogDraft();
  const d = logDraft;
  if(logHadTrade && !logResult){ toast("Selecciona el resultado del trade"); return; }
  if(!logRating){ toast("Elige una valoración del día"); return; }
  const dayTs = new Date(logDay+"T12:00:00").getTime();

  const tradeData = {
    date:dayTs, day:logDay, accountId: logSelectedAccount||null,
    hadTrade: logHadTrade,
    sessionStart: d.logSessionStart||null, sessionEnd: d.logSessionEnd||null,
    execTime: logHadTrade? (d.logExecTime||null) : null,
    newsToday: d.logNews||"",
    pnl: (logHadTrade && d.logPnl)? parseFloat(d.logPnl) : null,
    pnlPct: (logHadTrade && d.logPnlPct)? parseFloat(d.logPnlPct) : null,
    riskAmount: (logHadTrade && d.logRisk)? parseFloat(d.logRisk) : null,
    riskPct: (logHadTrade && d.logRiskPct)? parseFloat(d.logRiskPct) : null,
    rrTarget: (logHadTrade && d.logRR)? parseFloat(d.logRR) : null,
    result: logHadTrade? logResult : null,
    strategy: logHadTrade? (d.logStrategy||"") : "",
    timeframe: logHadTrade? (d.logTimeframe||"") : "",
    usedBE: logHadTrade? logUsedBE : false,
    beMoment: (logHadTrade && logUsedBE)? (d.logBeMoment||"") : "",
    notes: d.logNotes||"",
    feeling: d.logFeeling||"",
    mistakes: Array.isArray(d.logMistakes) ? d.logMistakes : (d.logMistakes ? d.logMistakes.split(",") : []),
    rating: logRating,

    photo: logPhotoPreview || null
  };

  const wasEditing = editingTradeId !== null;

  if(editingTradeId){
    const idx = state.trades.findIndex(x => x.id === editingTradeId);
    if(idx !== -1){
      state.trades[idx] = { ...state.trades[idx], ...tradeData };
    }
  } else {
    state.trades.push({ id:uid(), ...tradeData, createdAt:Date.now() });
  }

  save();
  editingTradeId = null;
  logHadTrade=true; logResult=null; logUsedBE=false; logRating=null; logPhotoPreview=null; logDraft={};
  toast(wasEditing ? "Cambios guardados" : "Día registrado");
  renderLog();
}

function deleteTrade(id){
  console.log("Intentando borrar trade:", id);
  if(!confirm("¿Estás seguro de que quieres eliminar este registro?")) return;

  const initialLength = state.trades.length;
  state.trades = state.trades.filter(x => x.id !== id);

  if (state.trades.length === initialLength) {
    toast("No se encontró el registro para eliminar");

  save();
  toast("Registro eliminado");

  // Volvemos a la lista del historial para evitar quedar en un detalle vacío

  renderHistory();

// ---------- Weekly review ----------
function startOfWeek(ts){
  const d = new Date(ts);
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(ts){ return String(startOfWeek(ts).getTime()); }
function monthKey(ts){ const d = new Date(ts); return d.getFullYear()+"-"+d.getMonth(); }
function fmtDate(ts){
  return new Date(ts).toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"});
}

          <div class="meta" style="display:flex; align-items:center; gap:4px; font-size:11px">
            <span>🕒 ${t.execTime || '—'}</span>

      ${bestDay && dayPhotos[bestDay[0]]? `<img src="${dayPhotos[bestDay[0]]}" class="cover" style="margin-top:8px">` : ''}
      <div class="meta" style="margin-top:10px">Peor día</div>
      <h3 class="money" style="margin-top:2px">${worstDay? worstDay[0]+' · $'+worstDay[1].toFixed(0) : '—'}</h3>
      ${worstDay && worstDay[0]!==(bestDay&&bestDay[0]) && dayPhotos[worstDay[0]]? `<img src="${dayPhotos[worstDay[0]]}" class="cover" style="margin-top:8px">` : ''}
    </div>
    <div class="card">
      <div class="meta">Error más caro</div>
      ${costliest? `
        <h3 class="money">${costliest.strategy? escapeHtml(costliest.strategy) : 'Sin estrategia registrada'} · $${costliest.pnl.toFixed(0)}</h3>
        ${costliest.mistakes? `<div class="meta">${escapeHtml(costliest.mistakes)}</div>` : ''}
      ` : `<div class="meta">Ninguna pérdida registrada esta semana</div>`}
    </div>` : `<div class="empty">Aún no has registrado trades esta semana.</div>`}

    <div class="section-title">Resumen mensual — ${monthName}</div>
    <div class="card">
      <div class="rowstats" style="margin-top:0">
        <div>Trades<strong>${mCount}</strong></div>
        <div>Winrate<strong>${mDecisive? mWinrate+'%':'—'}</strong></div>
        <div>P&L<strong class="money ${mPnlVals.length && mTotalPnl >= 0 ? 'pos' : 'neg'}">${mPnlVals.length? '$'+mTotalPnl.toFixed(0):'—'}</strong></div>
      </div>
      ${weekBreakdownHtml? `<div class="meta" style="margin-top:10px; font-weight:650">Por semana</div>${weekBreakdownHtml}` : `<div class="meta" style="margin-top:10px">Aún no hay semanas con datos este mes</div>`}
    </div>

    <label>¿Qué error se repitió esta semana?</label>
    <textarea id="revA1" placeholder="…">${escapeHtml(rev.a1)}</textarea>
    <label>¿Qué hiciste bien que quieres repetir?</label>
    <textarea id="revA2" placeholder="…">${escapeHtml(rev.a2)}</textarea>
    <label>¿Qué vas a cambiar la semana que viene?</label>
    <textarea id="revA3" placeholder="…">${escapeHtml(rev.a3)}</textarea>
    <button class="btn" style="margin-top:14px" onclick="saveReview('${key}')">Guardar revisión</button>
  `;
}
function saveReview(key){
  state.reviews[key] = {
    a1: document.getElementById("revA1").value.trim(),
    a2: document.getElementById("revA2").value.trim(),
    a3: document.getElementById("revA3").value.trim(),
    savedAt: Date.now()
  };
  save();
  toast("Revisión guardada");
}

// ---------- Finance: certificate wall + expense tracker ----------
let financeSubView = "certs";
let editingCertType = "eval";
let editingCertId = null;
let editingCertPhoto = null;
let editingExpenseType = "eval";
let editingExpenseId = null;
let editingPendingId = null;

function renderFinance(){
  const el = document.getElementById("view-certs");
  const totalFunded = state.certs.filter(c=>c.type==="eval").reduce((a,c)=>a+(c.amount||0),0);
  const totalFundedEUR = state.certs.filter(c=>c.type==="eval").reduce((a,c)=>a+(c.amountEUR||0),0);
  const paidFromCerts = state.certs.filter(c=>c.type==="payout").reduce((a,c)=>a+(c.amount||0),0);
  const paidFromCertsEUR = state.certs.filter(c=>c.type==="payout").reduce((a,c)=>a+(c.amountEUR||0),0);
  const paidFromPending = state.pendingPayouts.filter(p=>p.status==="cobrado").reduce((a,p)=>a+(p.amountUSD||0),0);
  const paidFromPendingEUR = state.pendingPayouts.filter(p=>p.status==="cobrado").reduce((a,p)=>a+(p.amountEUR||0),0);
  const totalPaid = paidFromCerts + paidFromPending;
  const totalPaidEUR = paidFromCertsEUR + paidFromPendingEUR;
  const totalSpent = state.expenses.reduce((a,e)=>a+(e.amountUSD||0),0);
  const totalSpentEUR = state.expenses.reduce((a,e)=>a+(e.amountEUR||0),0);
  const totalPending = state.pendingPayouts.filter(p=>p.status==="pendiente").reduce((a,p)=>a+(p.amountUSD||0),0);
  const totalPendingEUR = state.pendingPayouts.filter(p=>p.status==="pendiente").reduce((a,p)=>a+(p.amountEUR||0),0);
  const net = totalPaid - totalSpent;
  const netEUR = totalPaidEUR - totalSpentEUR;




  let html = `
    <div class="grid2" style="margin-bottom:8px">
      <div class="card" style="margin-bottom:0"><div class="meta">Fondeado</div><h3 class="money">$${totalFunded.toFixed(0)}</h3></div>
      <div class="card" style="margin-bottom:0"><div class="meta">Retirado</div><h3 class="money" style="color:var(--accent)">$${totalPaid.toFixed(0)} <span style="color:white; font-weight:100; opacity:0.5; margin:0 4px">|</span> €${totalPaidEUR.toFixed(0)}</h3></div>
      <div class="card" style="margin-bottom:0"><div class="meta">Pendiente</div><h3 class="money" style="color:var(--buffer)">$${totalPending.toFixed(0)} <span style="color:white; font-weight:100; opacity:0.5; margin:0 4px">|</span> €${totalPendingEUR.toFixed(0)}</h3></div>
      <div class="card" style="margin-bottom:0"><div class="meta">Gastado</div><h3 class="money" style="color:var(--loss)">$${totalSpent.toFixed(0)} <span style="color:white; font-weight:100; opacity:0.5; margin:0 4px">|</span> €${totalSpentEUR.toFixed(0)}</h3></div>
      <div class="card" style="margin-bottom:0"><div class="meta">Neto real</div><h3 class="money" style="color:${net > 0 ? 'var(--accent)' : net < 0 ? 'var(--loss)' : 'var(--be)'}">${(net>=0?'$':'-$')+Math.abs(net).toFixed(0)} <span style="color:white; font-weight:100; opacity:0.5; margin:0 4px">|</span> ${netEUR>=0?'€':'-€'}${Math.abs(netEUR).toFixed(0)}</h3></div>
    </div>
    <div class="segmented" style="margin:12px 0">
      <button class="${financeSubView==='certs'?'sel':''}" data-r="win" onclick="financeSubView='certs'; renderFinance();">Logros</button>
      <button class="${financeSubView==='pending'?'sel':''}" data-r="be" onclick="financeSubView='pending'; renderFinance();">Retiros</button>
      <button class="${financeSubView==='expenses'?'sel':''}" data-r="loss" onclick="financeSubView='expenses'; renderFinance();">Gastos</button>
    </div>`;

  if(financeSubView==="certs"){
    html += `<div class="top-actions"><button class="iconbtn" onclick="openNewCert()">+ Añadir Logro</button></div>`;
    if(state.certs.length===0){
      html += `<div class="empty">Cada eval superada y cada payout cobrado aparecerán aquí.</div>`;
    }else{
      [...state.certs].sort((a,b)=>b.date-a.date).forEach(c=>{
        const acc = c.accountId? state.accounts.find(a=>a.id===c.accountId) : null;
        html += `
          <div class="card" style="position:relative">
            ${c.photo? `<img src="${c.photo}" class="cover">` : ''}
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
              <h3 style="margin:0; color:var(--text)">${c.type==='eval'?'🎓 Eval superada':'💰 Payout cobrado'}</h3>
              <span style="cursor:pointer; font-size:16px; color:var(--text)" onclick="event.stopPropagation(); openEditCert('${c.id}')">⚙️</span>
            </div>
            <div class="meta">${acc? escapeHtml(acc.name)+' · ':''}${fmtDate(c.date)}</div>
            <div class="rowstats"><div>${c.type==='eval'?'Capital':'Importe'}<strong class="money">$${(c.amount||0).toFixed(0)}</strong></div></div>
            ${c.note? `<div class="meta" style="margin-top:6px">${escapeHtml(c.note)}</div>`:''}
          </div>`;
      });
    }
  }else if(financeSubView==="pending"){
    html += `<div class="top-actions"><button class="iconbtn" onclick="openNewPending()">+ Añadir Retiro</button></div>`;
    if(state.pendingPayouts.length===0){
      html += `<div class="empty">No hay retiros registrados.</div>`;
    }else{
      let totalRetiradoUSD = 0;
      let totalRetiradoEUR = 0;
      [...state.pendingPayouts].sort((a,b)=>b.date-a.date).forEach(p=>{
        const acc = p.accountId? state.accounts.find(a=>a.id===p.accountId) : null;
        const statusIcon = {
          'pendiente': '⏳',
          'cobrado': '✅',
          'denegado': '❌'
        }[p.status] || '⏳';

        if(p.status === 'cobrado') {
          totalRetiradoUSD += (p.amountUSD || 0);
          totalRetiradoEUR += (p.amountEUR || 0);
        }

        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
              <h3 style="margin:0">Retiro</h3>
              <span style="cursor:pointer; font-size:16px; color:var(--text)" onclick="openEditPending('${p.id}')">⚙️</span>
            </div>
            <div class="meta">${acc? escapeHtml(acc.name)+' · ' + escapeHtml(acc.firm) + ' · $' + (acc.size||0).toLocaleString() + ' · ':''}${p.date || 'Sin fecha'}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px">
              <div class="rowstats" style="margin-top:0">
                <div>Importe<strong class="money">$${(p.amountUSD||0).toFixed(0)} · €${(p.amountEUR||0).toFixed(0)}</strong></div>
              </div>
              <div style="font-size:12px; font-weight:700; color:var(--text-dim); display:flex; align-items:center; gap:4px">
                ${statusIcon} ${p.status.charAt(0).toUpperCase() + p.status.slice(1)}
              </div>
            </div>
            ${p.note? `<div class="meta" style="margin-top:6px">${escapeHtml(p.note)}</div>`:''}
          </div>`;
      });
      html += `
        <div class="card" style="background:var(--accent-soft); border-color:var(--accent); text-align:center">
          <div class="meta" style="color:var(--accent)">Total Retirado (Cobrado)</div>
          <h3 class="money" style="font-size:20px">$${totalRetiradoUSD.toFixed(0)} · €${totalRetiradoEUR.toFixed(0)}</h3>
        </div>`;
    }
  }else{
    html += `<div class="top-actions"><button class="iconbtn" onclick="openNewExpense()">+ Añadir Gasto</button></div>`;
    if(state.expenses.length===0){
      html += `<div class="empty">Evals, resets, activaciones y suscripciones aparecerán aquí.</div>`;
    }else{
      let totalSpentAccum = 0;
      [...state.expenses].sort((a,b)=>b.date-a.date).forEach(e=>{
        const acc = e.accountId? state.accounts.find(a=>a.id===e.accountId) : null;
        totalSpentAccum += (e.amountUSD || 0);
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
              <h3 style="margin:0">${escapeHtml(expenseLabel(e.type))}${e.recurring?' · mensual 🔁':''}</h3>
              <span style="cursor:pointer; font-size:16px; color:var(--text)" onclick="openEditExpense('${e.id}')">⚙️</span>
            </div>
            <div class="meta">${acc? escapeHtml(acc.name)+' · ' + escapeHtml(acc.firm) + ' · $' + (acc.size||0).toLocaleString() + ' · ':''}${fmtDate(e.date)}</div>
            <div class="rowstats"><div>Importe<strong class="money" style="color:var(--text)">$${(e.amountUSD||0).toFixed(0)} · €${(e.amountEUR||0).toFixed(0)}</strong></div></div>
            ${e.note? `<div class="meta" style="margin-top:6px">${escapeHtml(e.note)}</div>`:''}
          </div>`;
      });
      const totalSpentAccumEUR = state.expenses.reduce((a,e)=>a+(e.amountEUR||0),0);
      html += `
        <div class="card" style="background:rgba(209, 67, 67, 0.2); border-color:var(--loss); text-align:center">
          <div class="meta" style="color:var(--text)">Total Invertido (Gastos)</div>
          <h3 class="money" style="font-size:20px; color:var(--text)">$${totalSpentAccum.toFixed(0)} · €${totalSpentAccumEUR.toFixed(0)}</h3>
        </div>`;
    }
  }
  el.innerHTML = html;
}
function expenseLabel(t){
  return {eval:"Eval / challenge", reset:"Reset", activation:"Activación", subscription:"Suscripción", other:"Otro"}[t] || t;
}

function openNewCert(){ editingCertId=null; editingCertType="eval"; editingCertPhoto=null; document.getElementById("view-certs").innerHTML = certFormHtml(); bindCertForm(); }
function openEditCert(id){
  editingCertId=id;
  const c = state.certs.find(x=>x.id===id);
  editingCertType = c.type;
  editingCertPhoto = c.photo || null;
  document.getElementById("view-certs").innerHTML = certFormHtml();
  bindCertForm();
}
function certFormHtml(){
  const c = editingCertId? state.certs.find(x=>x.id===editingCertId): null;
  const type = editingCertType;
  const accOptions = `<option value="">Sin cuenta</option>` + state.accounts.map(a=>`<option value="${a.id}" ${c&&c.accountId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join("");
  return `
    <label>Tipo de logro</label>
    <div class="segmented">
      <button class="${type==='eval'?'sel':''}" data-r="be" onclick="editingCertType='eval'; document.getElementById('view-certs').innerHTML=certFormHtml(); bindCertForm();">Eval superada</button>
      <button class="${type==='payout'?'sel':''}" data-r="win" onclick="editingCertType='payout'; document.getElementById('view-certs').innerHTML=certFormHtml(); bindCertForm();">Payout</button>
    </div>
    <label>Cuenta</label>
    <select id="certAccount">${accOptions}</select>
    <label>${type==='eval'?'Capital fondeado ($)':'Importe del payout ($)'}</label>
    <input type="number" step="1" id="certAmount" value="${c&&c.amount!=null?c.amount:''}" placeholder="Ej. 50000">
    <label>Fecha</label>
    <input type="date" id="certDate" value="${c? new Date(c.date).toISOString().slice(0,10) : ''}">
    <label>Nota (opcional)</label>
    <input type="text" id="certNote" value="${c?escapeHtml(c.note||''):''}" placeholder="Ej. Segundo intento">
    <label>Foto (opcional)</label>
    <input type="file" accept="image/*" id="certPhotoInput">
    ${editingCertPhoto? `<img src="${editingCertPhoto}" class="cover" style="margin-top:8px">` : ""}
    <button class="btn" style="margin-top:14px" onclick="saveCert()">${c?'Guardar cambios':'Añadir logro'}</button>
    ${c?'<button class="btn danger" style="margin-top:8px" onclick="deleteCert()">Eliminar</button>':''}
    <button class="btn secondary" style="margin-top:8px" onclick="renderFinance()">Cancelar</button>
  `;
}
function bindCertForm(){
  const input = document.getElementById("certPhotoInput");
  if(!input) return;
  input.addEventListener("change", async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      editingCertPhoto = await compressImage(file, 900, 0.6);
      document.getElementById("view-certs").innerHTML = certFormHtml();
    }catch(err){ console.error(err); toast("No se pudo procesar la imagen"); }
  });
}
function saveCert(){
  const amountRaw = document.getElementById("certAmount").value;
  const amount = amountRaw? parseFloat(amountRaw) : 0;
  const accountId = document.getElementById("certAccount").value || null;
  const note = document.getElementById("certNote").value.trim();
  const dateVal = document.getElementById("certDate").value;
  const date = dateVal ? new Date(dateVal + "T12:00:00").getTime() : Date.now();
  if(editingCertId){
    const c = state.certs.find(x=>x.id===editingCertId);
    c.type=editingCertType; c.accountId=accountId; c.amount=amount; c.note=note; c.photo=editingCertPhoto; c.date=date;
  }else{
    state.certs.push({id:uid(), type:editingCertType, accountId, amount, note, photo:editingCertPhoto, date:date});
  }
  save();
  editingCertPhoto = null;
  toast("Logro guardado");
  renderFinance();
}
function deleteCert(){
  state.certs = state.certs.filter(x=>x.id!==editingCertId);
  save();
  toast("Logro eliminado");
  renderFinance();
}

function openNewExpense(){ editingExpenseId=null; editingExpenseType="eval"; document.getElementById("view-certs").innerHTML = expenseFormHtml(); }
function openEditExpense(id){
  editingExpenseId=id;
  editingExpenseType = state.expenses.find(x=>x.id===id).type;
  document.getElementById("view-certs").innerHTML = expenseFormHtml();
}
function expenseFormHtml(){
  const e = editingExpenseId? state.expenses.find(x=>x.id===editingExpenseId): null;
  const types = ["eval","reset","activation","subscription","other"];
  const typeOptions = types.map(t=>`<option value="${t}" ${editingExpenseType===t?'selected':''}>${expenseLabel(t)}</option>`).join("");
  const accOptions = `<option value="">Sin cuenta</option>` + state.accounts.map(a=>`<option value="${a.id}" ${e&&e.accountId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join("");
  return `
    <label>Tipo de gasto</label>
    <select id="expType" onchange="editingExpenseType=this.value;">${typeOptions}</select>
    <label>Cuenta</label>
    <select id="expAccount">${accOptions}</select>
    <label>Fecha</label>
    <input type="date" id="expDate" value="${e ? new Date(e.date).toISOString().slice(0,10) : ''}">
    <div class="grid2">
      <div>
        <label>Importe ($)</label>
        <input type="number" step="0.01" id="expAmountUSD" value="${e&&e.amountUSD!=null?e.amountUSD:''}" placeholder="Ej. 65">
      </div>
      <div>
        <label>Importe (€)</label>
        <input type="number" step="0.01" id="expAmountEUR" value="${e&&e.amountEUR!=null?e.amountEUR:''}" placeholder="Ej. 60">
      </div>
    </div>
    <label class="chk" style="border:none; padding:4px 0">
      <input type="checkbox" id="expRecurring" ${e&&e.recurring?'checked':''}>
      <span>Es un gasto mensual recurrente</span>
    </label>
    <label>Nota (opcional)</label>
    <input type="text" id="expNote" value="${e?escapeHtml(e.note||''):''}" placeholder="Ej. Reset tras romper regla diaria">
    <button class="btn" style="margin-top:10px" onclick="saveExpense()">${e?'Guardar cambios':'Añadir gasto'}</button>
    ${e?'<button class="btn danger" style="margin-top:8px" onclick="deleteExpense()">Eliminar</button>':''}
    <button class="btn secondary" style="margin-top:8px" onclick="renderFinance()">Cancelar</button>
  `;
}
function saveExpense(){
  const type = document.getElementById("expType").value;
  const accountId = document.getElementById("expAccount").value || null;
  const amountUSD = document.getElementById("expAmountUSD").value;
  const amountEUR = document.getElementById("expAmountEUR").value;
  const recurring = document.getElementById("expRecurring").checked;
  const note = document.getElementById("expNote").value.trim();
  const dateVal = document.getElementById("expDate").value;
  const date = dateVal ? new Date(dateVal + "T12:00:00").getTime() : Date.now();
  if(!accountId || !amountUSD || !amountEUR){ toast("Completa los campos obligatorios"); return; }
  if(editingExpenseId){
    const e = state.expenses.find(x=>x.id===editingExpenseId);
    e.type=type; e.accountId=accountId; e.amountUSD=parseFloat(amountUSD); e.amountEUR=parseFloat(amountEUR); e.recurring=recurring; e.note=note; e.date=date;
  }else{
    state.expenses.push({id:uid(), type, accountId, amountUSD:parseFloat(amountUSD), amountEUR:parseFloat(amountEUR), recurring, note, date:date});
  }
  save();
  toast("Gasto guardado");
  renderFinance();
}
function openNewPending(){ editingPendingId=null; document.getElementById("view-certs").innerHTML = pendingPayoutFormHtml(); }
function openEditPending(id){
  editingPendingId=id;
  document.getElementById("view-certs").innerHTML = pendingPayoutFormHtml();
}
function pendingPayoutFormHtml(){
  const p = editingPendingId? state.pendingPayouts.find(x=>x.id===editingPendingId): null;
  const accOptions = `<option value="">Sin cuenta</option>` + state.accounts.map(a=>`<option value="${a.id}" ${p&&p.accountId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join("");
  const statusOptions = `
    <option value="pendiente" ${p&&p.status==='pendiente'?'selected':''}>⏳ Pendiente</option>
    <option value="cobrado" ${p&&p.status==='cobrado'?'selected':''}>✅ Cobrado</option>
    <option value="denegado" ${p&&p.status==='denegado'?'selected':''}>❌ Denegado</option>
  `;
  return `
    <label>Cuenta</label>
    <select id="penAcc">${accOptions}</select>
    <label>Estado</label>
    <select id="penStatus">${statusOptions}</select>
    <label>Fecha estimada de cobro</label>
    <input type="date" id="penDate" value="${p? p.date : ''}">
    <div class="grid2">
      <div>
        <label>Importe ($)</label>
        <input type="number" step="0.01" id="penAmountUSD" value="${p&&p.amountUSD!=null?p.amountUSD:''}" placeholder="Ej. 1500">
      </div>
      <div>
        <label>Importe (€)</label>
        <input type="number" step="0.01" id="penAmountEUR" value="${p&&p.amountEUR!=null?p.amountEUR:''}" placeholder="Ej. 1380">
      </div>
    </div>
    <label>Nota (opcional)</label>
    <input type="text" id="penNote" value="${p?escapeHtml(p.note||''):''}" placeholder="Ej. Payout primera fase">
    <button class="btn" style="margin-top:14px" onclick="savePending()">${p?'Guardar cambios':'Añadir pendiente'}</button>
    ${p?'<button class="btn danger" style="margin-top:8px" onclick="deletePending()">Eliminar</button>':''}
    <button class="btn secondary" style="margin-top:8px" onclick="renderFinance()">Cancelar</button>
  `;
}
function savePending(){
  const accountId = document.getElementById("penAcc").value || null;
  const status = document.getElementById("penStatus").value;
  const date = document.getElementById("penDate").value;
  const amountUSD = document.getElementById("penAmountUSD").value;
  const amountEUR = document.getElementById("penAmountEUR").value;
  const note = document.getElementById("penNote").value.trim();
  if(!accountId || !date || !amountUSD || !amountEUR){ toast("Completa los campos obligatorios"); return; }
  if(editingPendingId){
    const p = state.pendingPayouts.find(x=>x.id===editingPendingId);
    p.accountId=accountId; p.status=status; p.date=date; p.amountUSD=parseFloat(amountUSD); p.amountEUR=parseFloat(amountEUR); p.note=note;
  }else{
    state.pendingPayouts.push({id:uid(), accountId, status, date, amountUSD:parseFloat(amountUSD), amountEUR:parseFloat(amountEUR), note, createdAt:Date.now()});
  }
  save();
  toast("Payout pendiente guardado");
  renderFinance();
}
function deletePending(){
  state.pendingPayouts = state.pendingPayouts.filter(x=>x.id!==editingPendingId);
  save();
  toast("Payout eliminado");
  renderFinance();
}

function renderHistory(tradeId = null) {
  const el = document.getElementById("view-history");

  if (tradeId) {
    const t = state.trades.find(x => x.id === tradeId);
    if (!t) { renderHistory(); return; }
    const acc = t.accountId ? state.accounts.find(a => a.id === t.accountId) : null;

    el.innerHTML = `

function renderCharts(startFilter, endFilter){
  // Get canvas contexts
  const dailyCanvas = document.getElementById('dailyPnLChart');
  const balanceCanvas = document.getElementById('balanceChart');
  if (!dailyCanvas || !balanceCanvas) return;
  const ctxDaily = dailyCanvas.getContext('2d');
  const ctxBalance = balanceCanvas.getContext('2d');

  // Filter trades by date if filters are provided
  let filteredTrades = [...state.trades];
  if (startFilter) {
    const startTs = new Date(startFilter + "T00:00:00").getTime();
    filteredTrades = filteredTrades.filter(t => t.date >= startTs);
  }
  if (endFilter) {
    const endTs = new Date(endFilter + "T23:59:59").getTime();
    filteredTrades = filteredTrades.filter(t => t.date <= endTs);
  }

  // Prepare data: daily totals
  const dailyMap = {};
  filteredTrades.forEach(t => {
    if (t.pnl != null) {
      dailyMap[t.day] = (dailyMap[t.day] || 0) + t.pnl;
    }
  });
  const dailyLabels = Object.keys(dailyMap).sort();
  const dailyData = dailyLabels.map(d => dailyMap[d]);

  // Balance cumulative (starting from total account sizes)
  const totalAccountSize = (state.accounts || []).reduce((sum, a) => sum + (a.size || 0), 0);
  let cumulative = totalAccountSize;
  const balanceLabels = [];
  const balanceData = [];
  dailyLabels.forEach(d => {
    cumulative += dailyMap[d] || 0;
    balanceLabels.push(d);
    balanceData.push(cumulative);
  });

  // Destroy previous charts if they exist to avoid duplicates
  if (window._dailyChart) window._dailyChart.destroy();
  if (window._balanceChart) window._balanceChart.destroy();

  window._dailyChart = new Chart(ctxDaily, {
    type: 'line',
    data: {
      labels: dailyLabels,
      datasets: [{
        label: 'PnL diario',
        data: dailyData,
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--win').trim() || '#4CC17E',
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--win-soft').trim() || 'rgba(76,193,126,0.2)',
        fill: false,
        tension: 0.2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: true } },
      scales: { y: { beginAtZero: true } }
    }
  });

  window._balanceChart = new Chart(ctxBalance, {
    type: 'line',
    data: {
      labels: balanceLabels,
      datasets: [{
        label: 'Balance acumulado',
        data: balanceData,
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2383E2',
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--accent-soft').trim() || 'rgba(35,131,226,0.2)',
        fill: false,
        tension: 0.2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: true } },
      scales: { y: { beginAtZero: false } }
    }
  });
}


function calculateMistakeMetrics() {
  const metrics = {};
  let totalLosses = 0;

  state.trades.forEach(t => {
    if (!t.mistakes) return;
    const mList = Array.isArray(t.mistakes) ? t.mistakes : t.mistakes.split(",");
    const pnl = t.pnl || 0;

    mList.forEach(m => {
      const mistake = m.trim();
      if (!mistake) return;
      if (!metrics[mistake]) {
        metrics[mistake] = { count: 0, totalPnl: 0 };
      }
      metrics[mistake].count++;
      metrics[mistake].totalPnl += pnl;
    });

    if (pnl < 0) totalLosses += Math.abs(pnl);
  });

  return { metrics, totalLosses };
}

function renderMistakeAnalysis() {
  const { metrics, totalLosses } = calculateMistakeMetrics();
  const sorted = Object.entries(metrics)
    .filter(([_, data]) => data.totalPnl < 0)
    .sort((a, b) => a[1].totalPnl - b[1].totalPnl);

  if (sorted.length === 0) return "";

  let html = `<div class="section-title">Fugas de Capital (Errores)</div><div class="mistake-analysis-card">`;

  sorted.forEach(([name, data]) => {
    const cost = Math.abs(data.totalPnl);
    const impactPct = totalLosses > 0 ? (cost / totalLosses) * 100 : 0;
    html += `
      <div class="mistake-row">
        <div class="info">${escapeHtml(name)} <span style="color:var(--text-dim); font-weight:400">(${data.count}x)</span></div>
        <div class="impact-bar-container">
          <div class="impact-bar" style="width: ${impactPct}%"></div>
        </div>
        <div class="cost">-$${cost.toFixed(0)}</div>
      </div>`;
  });

  html += `</div>`;
  return html;
}

function renderHeatmap() {
  const grid = document.getElementById("heatmap-grid");
  const label = document.getElementById("heatmap-month-label");
  if(!grid || !label) return;

  const year = currentHeatmapDate.getFullYear();
  const month = currentHeatmapDate.getMonth();

  label.textContent = new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" }).format(currentHeatmapDate).toUpperCase();

  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Crear cabecera de días de la semana (Lunes a Viernes)
  const dayLabels = ["Lun", "Mar", "Mie", "Jue", "Vie"];
  let headerHtml = `<div class="heatmap-header" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; max-width:300px; margin:0 auto 4px; font-size:10px; color:var(--text-dim); text-align:center; font-weight:600">`;
  dayLabels.forEach(day => {
    headerHtml += `<div>${day}</div>`;
  });
  headerHtml += `</div>`;

  const container = grid.parentElement;
  const oldHeader = container.querySelector('.heatmap-header');
  if(oldHeader) oldHeader.remove();
  container.insertBefore(document.createRange().createContextualFragment(headerHtml), grid);

  grid.innerHTML = "";

  // Para que los días coincidan con su columna (Lun-Vie), necesitamos saber
  // qué día de la semana empieza el mes y rellenar el espacio inicial.
  const firstDayDate = new Date(year, month, 1);
  let firstDayOfWeek = firstDayDate.getDay(); // 0=Dom, 1=Lun...

  // Ajustamos el día de inicio para que el calendario empiece en Lunes (1)
  // Si es domingo(0), lo tratamos como si fuera el final de la semana anterior para el cálculo de offsets
  let offset = 0;
  if (firstDayOfWeek === 0) {
    // Domingo: el primer día laborable es el Lunes (día 1 o 2 del mes)
    // Pero para el grid de 5 columnas, necesitamos saber cuántos espacios vacíos hay
    // desde el lunes anterior.
    offset = 0; // El domingo no cuenta, empezamos el lunes.
  } else {
    // Lun=1 -> offset 0, Mar=2 -> offset 1... Sab=6 -> offset 0 (porque el sábado no existe en el grid)
    offset = (firstDayOfWeek === 6) ? 0 : (firstDayOfWeek - 1);
  }

  // Si el mes empieza en sábado(6), el primer día laborable es el domingo(0), pero el domingo tampoco existe.
  // El primer espacio real será el lunes siguiente.
  // Simplificación: calculamos el offset exacto de celdas vacías para llegar al primer Lunes.

  // Forma más robusta:
  // Determinamos cuántos días laborables hay ANTES del día 1 del mes en su semana respectiva.
  // O mejor: calculamos la posición del día 1 en un grid de 5 (Lun-Vie).

  // El offset es cuántos días laborables hay en la primera semana antes del día 1.
  // Si el día 1 es Lunes(1) -> 0 vacíos.
  // Si el día 1 es Martes(2) -> 1 vacío (Lunes).
  // Si el día 1 es Viernes(5) -> 4 vacíos (Lun, Mar, Mie, Jue).
  // Si el día 1 es Sábado(6) o Domingo(0) -> 0 vacíos para la semana siguiente,
  // pero el día 1 no se dibuja. El primer dibujo será el lunes.

  let padding = 0;
  if (firstDayOfWeek !== 0 && firstDayOfWeek !== 6) {
    padding = firstDayOfWeek - 1;
  } else if (firstDayOfWeek === 0) {
    // Domingo: el día 1 no se dibuja, el primer día dibujable es el día 2 (si es lunes)
    // El offset para el día 1 es irrelevante, pero para el día 2 será 0.
    padding = 0;
  }

  // Añadir celdas vacías para alinear el primer día del mes con su columna
  for(let i=0; i<padding; i++) {
    grid.appendChild(document.createElement("div"));
  }

  for(let d=1; d<=daysInMonth; d++) {
    const date = new Date(year, month, d);
    const dayOfWeek = date.getDay();

    if(dayOfWeek === 0 || dayOfWeek === 6) continue;

    const dayCell = document.createElement("div");
    dayCell.className = "heatmap-day";
    dayCell.textContent = d;

    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayPnL = state.trades
      .filter(t => t.day === dateStr)
      .reduce((sum, t) => sum + (t.pnl || 0), 0);

    if(dayPnL !== 0) {
      // Buscar el trade del día para determinar el resultado
      const trade = state.trades.find(t => t.day === dateStr);
      if (trade) {
        const res = trade.result;
        let borderColor = 'var(--border)';
        let bgColor = 'transparent';

        if (res === 'TP') {
          borderColor = 'var(--win)';
          bgColor = 'var(--win-soft)';
        } else if (res === 'SL') {
          borderColor = 'var(--loss)';
          bgColor = 'var(--loss-soft)';
        } else if (res === 'BE') {
          borderColor = 'var(--be)';
          bgColor = 'var(--be-soft)';
        } else if (res === 'TIME') {
          const isPos = trade.pnl > 0;
          const isNeg = trade.pnl < 0;
          borderColor = isPos ? 'var(--win)' : (isNeg ? 'var(--loss)' : 'var(--be)');
          bgColor = isPos ? 'var(--win-soft)' : (isNeg ? 'var(--loss-soft)' : 'var(--be-soft)');
        } else {
          borderColor = dayPnL > 0 ? 'var(--win)' : 'var(--loss)';
          bgColor = dayPnL > 0 ? 'var(--win-soft)' : 'var(--loss-soft)';
        }
        dayCell.style.borderColor = borderColor;
        dayCell.style.backgroundColor = bgColor;
      } else {
        dayCell.style.borderColor = dayPnL > 0 ? 'var(--win)' : 'var(--loss)';
        dayCell.style.backgroundColor = dayPnL > 0 ? 'var(--win-soft)' : 'var(--loss-soft)';
      }
    }

    dayCell.onclick = () => {
      const trade = state.trades.find(t => t.day === dateStr);
      if (trade) {
        selectTradeHistory(trade.id);
        showView('history');

        setTimeout(() => {
          const tradeElement = document.querySelector(`.card[data-trade-id="${trade.id}"]`);

          if (tradeElement) {
            const weekContainer = tradeElement.closest('.week-trades');
            if (weekContainer) {
              weekContainer.style.display = 'block';
            }

            tradeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Determinar color de resaltado según resultado
            let highlightColor = 'var(--accent-soft)';
            if (trade.result === 'TP') highlightColor = 'var(--win-soft)';
            else if (trade.result === 'SL') highlightColor = 'var(--loss-soft)';
            else if (trade.result === 'BE') highlightColor = 'var(--be-soft)';
            else if (trade.result === 'TIME') {
              highlightColor = trade.pnl > 0 ? 'var(--win-soft)' : (trade.pnl < 0 ? 'var(--loss-soft)' : 'var(--be-soft)');
            }

            tradeElement.style.transition = 'background 0.3s';
            tradeElement.style.background = highlightColor;
            setTimeout(() => { tradeElement.style.background = ''; }, 1000);
          }
        }, 250);
      } else {
        // No hacemos nada si no hay trade
      }
    };
    grid.appendChild(dayCell);
  }
  lucide.createIcons();
}

function changeHeatmapMonth(delta) {
  currentHeatmapDate.setMonth(currentHeatmapDate.getMonth() + delta);
  renderHeatmap();
  renderHistory();
}

function updateEquityCurve() {
  const start = document.getElementById("filterStart").value;
  const end = document.getElementById("filterEnd").value;
  renderCharts(start, end);
}
load();
initPrivacy();
renderLog();
lucide.createIcons();
</script>
</body>
